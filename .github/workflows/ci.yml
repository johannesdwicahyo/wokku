name: CI
on: [push, pull_request]

jobs:
  boot:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          working-directory: harness
          bundler-cache: true
      - name: Prepare database via the real install path (baseline migration + seeds)
        working-directory: harness
        run: bin/rails db:prepare db:seed
      - name: Boot with eager load (the engine-purity gate)
        working-directory: harness
        run: HARNESS_EAGER_LOAD=1 bin/rails runner 'puts "eager load OK — #{AppRecord.name}, providers: #{Wokku.config.dns_provider.class}"'

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Load engine schema into the test DB
        run: |
          createdb -h localhost -U postgres wokku_oss_harness_test
          psql -h localhost -U postgres -d wokku_oss_harness_test -f db/structure.sql
        env:
          PGPASSWORD: postgres
      - name: RSpec (engine suite + SimpleCov, parallel to avoid single-process OOM)
        run: |
          bundle exec rake parallel:create parallel:load_structure 2>/dev/null || \
            for i in $(seq 1 $(nproc)); do createdb -h localhost -U postgres "wokku_oss_harness_test$([ $i -eq 1 ] && echo '' || echo $i)" 2>/dev/null; psql -h localhost -U postgres -d "wokku_oss_harness_test$([ $i -eq 1 ] && echo '' || echo $i)" -f db/structure.sql >/dev/null 2>&1; done
          bundle exec parallel_rspec spec/
      - name: Coverage gate (merged, 95% line)
        run: bundle exec rake coverage:check

  wokkud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: wokkud/go.sum
      - name: Vet + test
        working-directory: wokkud
        run: |
          go vet ./...
          go test ./...
