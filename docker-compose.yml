# Self-host Wokku. Easiest: `sudo bash install.sh` (or the curl one-liner
# in the README) — it writes .env, starts this stack, and installs the app
# runtime on the box. First visit shows /setup to create your admin.
services:
  web:
    # Prebuilt image (install.sh pulls it; pin a release with WOKKU_VERSION
    # in .env). `docker compose build` still builds it from this checkout.
    image: ghcr.io/johannesdwicahyo/wokku:${WOKKU_VERSION:-latest}
    build:
      context: .
      dockerfile: harness/Dockerfile
    # Bound to loopback: the dashboard is served by the host's Caddy on
    # 80/443 at the canonical apex (wokkud renders the route).
    ports: ["127.0.0.1:3000:3000"]
    # Come back after a crash or a server reboot without anyone touching it.
    restart: unless-stopped
    # Optional settings (SMTP_*, MAIL_FROM, WOKKU_GIT_HOST, ...) live in .env.
    env_file:
      - path: .env
        required: false
    environment:
      PGHOST: db
      PGUSER: wokku
      PGPASSWORD: wokku
      SECRET_KEY_BASE: "${SECRET_KEY_BASE:?generate one with openssl rand -hex 64}"
      WOKKU_CONTROL_PLANE_UPSTREAM: 127.0.0.1:3000
      WOKKU_CANONICAL_DOMAIN: ${WOKKU_CANONICAL_DOMAIN:-localhost}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: wokku
      POSTGRES_PASSWORD: wokku
      POSTGRES_DB: wokku_oss_harness_production
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wokku"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
