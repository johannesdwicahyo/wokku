default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("PGHOST", "localhost") %>
  username: <%= ENV.fetch("PGUSER", ENV.fetch("USER", "postgres")) %>
  password: <%= ENV["PGPASSWORD"] %>
  # Fresh databases load the engine's schema dump (see config/application.rb).
  # (Rails resolves this relative to harness/db/, even for absolute paths.)
  schema_dump: ../../db/structure.sql

development:
  <<: *default
  database: wokku_oss_harness

test:
  <<: *default
  # parallel_tests: worker 1 gets "", workers 2+ get "2".."N" — matches the DBs CI creates
  database: wokku_oss_harness_test<%= ENV["TEST_ENV_NUMBER"] %>

production:
  <<: *default
  database: wokku_oss_harness_production
