---
openapi: 3.0.3
info:
  title: Wokku API (engine)
  version: v1
servers:
- url: https://wokku.cloud
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      required:
      - error
      - error_code
      - retryable
      properties:
        error:
          type: string
        error_code:
          type: string
        hint:
          type: string
          nullable: true
        retryable:
          type: boolean
        details:
          nullable: true
        errors:
          nullable: true
    Team:
      type: object
      required:
      - id
      - name
      - owner_id
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        owner_id:
          type: string
          format: uuid
        plan_id:
          type: string
          format: uuid
          nullable: true
        kind:
          type: string
          enum:
          - personal
          - org
          nullable: true
        slug:
          type: string
          nullable: true
        trial_ends_at:
          type: string
          format: date-time
          nullable: true
        billing_anchor_date:
          type: string
          format: date
          nullable: true
        payment_method_type:
          type: string
        billing_model:
          type: string
        billing_credit_idr:
          type: integer
        billing_switched_on:
          type: string
          format: date
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TeamMember:
      type: object
      required:
      - id
      - user_id
      - email
      - role
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum:
          - viewer
          - member
          - admin
    App:
      type: object
      required:
      - id
      - name
      - server_id
      - team_id
      - status
      - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        server_id:
          type: string
          format: uuid
        team_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - running
          - stopped
          - crashed
          - deploying
          - sleeping
          - created
        is_preview:
          type: boolean
        pr_number:
          type: integer
          nullable: true
        parent_app_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by_id:
          type: string
          format: uuid
        deploy_branch:
          type: string
          nullable: true
        box_size:
          type: string
          nullable: true
        git_repository_url:
          type: string
          nullable: true
        github_repo_full_name:
          type: string
          nullable: true
        pending_action:
          type: string
          nullable: true
        container_port:
          type: integer
        cloudflare_proxied:
          type: boolean
        https_redirect:
          type: boolean
        maintenance_mode:
          type: boolean
        enabled_shared_engines:
          type: array
          items:
            type: string
        uptime_status:
          type: string
        deploy_locked_at:
          type: string
          format: date-time
          nullable: true
        last_commit_sha:
          type: string
          nullable: true
        git_remote:
          type: string
        push_instructions:
          type: string
        host_status:
          type: string
          nullable: true
        host_heartbeat_at:
          type: string
          format: date-time
          nullable: true
        warnings:
          type: array
          items:
            type: string
    Deploy:
      type: object
      required:
      - id
      - status
      - created_at
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - pending
          - building
          - succeeded
          - failed
          - timed_out
        commit_sha:
          type: string
          nullable: true
        log:
          type: string
          nullable: true
          description: Only on deploys.show
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    Release:
      type: object
      required:
      - id
      - version
      - app_record_id
      - created_at
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
        description:
          type: string
          nullable: true
        app_record_id:
          type: string
          format: uuid
        deploy_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Process:
      type: object
      required:
      - processes
      properties:
        processes:
          type: object
          additionalProperties:
            type: string
    Database:
      type: object
      required:
      - id
      - name
      - service_type
      - status
      - server_id
      - shared
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        service_type:
          type: string
          description: postgres, mariadb, mongodb, redis, memcached, ...
        status:
          type: string
          enum:
          - running
          - stopped
          - creating
          - error
          - upgrading_provisioning
          - upgrading_migrating
          - upgrading_cutover
          - upgrading_failed
          - pending_destroy
        server_id:
          type: string
          format: uuid
        tier_name:
          type: string
          nullable: true
        shared:
          type: boolean
          description: true = per-tenant database on a shared engine
        wokkud_managed:
          type: boolean
        dsn:
          type: string
          nullable: true
          description: Connection URL including credentials (e.g. postgres://user:pass@host:5432/db)
        parent_service_id:
          type: string
          format: uuid
          nullable: true
        upgrade_source_id:
          type: string
          format: uuid
          nullable: true
        creator_id:
          type: string
          format: uuid
          nullable: true
        over_quota_at:
          type: string
          format: date-time
          nullable: true
        pending_destroy_at:
          type: string
          format: date-time
          nullable: true
        connection_limit:
          type: integer
          nullable: true
        storage_mb_quota:
          type: integer
          nullable: true
        shared_role_name:
          type: string
          nullable: true
        shared_db_name:
          type: string
          nullable: true
        live_db_bytes:
          type: integer
          nullable: true
        live_mem_used_mb:
          type: integer
          nullable: true
        live_metrics_at:
          type: string
          format: date-time
          nullable: true
        last_error:
          type: string
          nullable: true
        cpu:
          type: number
          nullable: true
        memory_mb:
          type: integer
          nullable: true
        disk_gb:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Domain:
      type: object
      required:
      - id
      - hostname
      - app_record_id
      - ssl_enabled
      - dns_verified
      - created_at
      properties:
        id:
          type: string
          format: uuid
        hostname:
          type: string
        app_record_id:
          type: string
          format: uuid
        ssl_enabled:
          type: boolean
        dns_verified:
          type: boolean
        pending_action:
          type: string
          nullable: true
          description: e.g. ssl_enable while certificate issuance is queued
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Server:
      type: object
      required:
      - id
      - name
      - host
      - port
      - status
      - created_at
      - heartbeat_status
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        host:
          type: string
        port:
          type: integer
        status:
          type: string
          enum:
          - connected
          - unreachable
          - auth_failed
          - syncing
        heartbeat_status:
          type: string
          enum:
          - unknown
          - ok
          - degraded
          - down
        heartbeat_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        ssh_user:
          type: string
          nullable: true
        team_id:
          type: string
          format: uuid
          nullable: true
        region:
          type: string
          nullable: true
        cloud_provider:
          type: string
          nullable: true
        cloud_server_id:
          type: string
          nullable: true
        monthly_cost_cents:
          type: integer
          nullable: true
        capacity_total_mb:
          type: integer
          nullable: true
        live_cpu_pct:
          type: string
          nullable: true
          description: Decimal serialized as a string
        live_mem_used_mb:
          type: integer
          nullable: true
        live_mem_total_mb:
          type: integer
          nullable: true
        live_container_count:
          type: integer
          nullable: true
        live_metrics_at:
          type: string
          format: date-time
          nullable: true
        docker_status:
          type: string
          nullable: true
        docker_status_checked_at:
          type: string
          format: date-time
          nullable: true
        vitals:
          type: object
        agent_version:
          type: string
          nullable: true
        wokkud_builds_enabled:
          type: boolean
        wokkud_router_enabled:
          type: boolean
        wokkud_services_enabled:
          type: boolean
        wokkud_cron_enabled:
          type: boolean
    Template:
      type: object
      required:
      - name
      - slug
      - description
      - category
      - tags
      - deploy_method
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        category:
          type: string
        icon:
          type: string
          nullable: true
        icon_slug:
          type: string
          nullable: true
        icon_color:
          type: string
          nullable: true
        version:
          type: string
          nullable: true
        repo:
          type: string
          nullable: true
        branch:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
        deploy_method:
          type: string
          description: e.g. docker_image, git
        docker_image:
          type: string
          nullable: true
        container_port:
          type: integer
          nullable: true
        addons:
          type: array
          items:
            type: object
        env:
          type: object
          additionalProperties:
            type: string
        post_deploy:
          type: string
          nullable: true
        healthcheck:
          nullable: true
        command:
          type: string
          nullable: true
        min_tier:
          type: string
          nullable: true
        set_url:
          type: array
          items:
            type: string
        generate_secrets:
          type: array
          items:
            type: string
        alias_env:
          type: object
        storage_mounts:
          type: array
          items: {}
        shared_engines:
          type: array
          items:
            type: string
        dedicated_db_engine:
          type: string
          nullable: true
        builder:
          nullable: true
        services:
          type: object
    Device:
      type: object
      required:
      - token
      - platform
      properties:
        token:
          type: string
        platform:
          type: string
          enum:
          - ios
          - android
    Activity:
      type: object
      required:
      - id
      - action
      - description
      - created_at
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
        description:
          type: string
        target_name:
          type: string
          nullable: true
        target_type:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
security:
- bearer: []
paths:
  "/api/v1/activities":
    get:
      summary: Recent activity for the caller's first team
      operationId: activities.list
      tags:
      - activities
      security:
      - bearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      responses:
        '200':
          description: activities, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Activity"
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/apps/{app_id}/addons":
    parameters:
    - name: app_id
      in: path
      schema:
        type: string
      description: App UUID or name
      required: true
    get:
      summary: List the app's add-ons (databases)
      operationId: addons.list
      tags:
      - addons
      security:
      - bearer: []
      responses:
        '200':
          description: add-ons
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                  - id
                  - name
                  - service_type
                  - status
                  - server
                  - shared
                  properties:
                    id:
                      type: string
                      format: uuid
                    name:
                      type: string
                    service_type:
                      type: string
                    status:
                      type: string
                    server:
                      type: string
                      description: server name
                    shared:
                      type: boolean
                    tier_name:
                      type: string
                      nullable: true
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: unknown app, or an app of a team the caller does not belong
            to
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    post:
      summary: 'Create an add-on (retired: use addons.enable_shared / addons.upgrade_dedicated)'
      operationId: addons.create
      tags:
      - addons
      deprecated: true
      security:
      - bearer: []
      responses:
        '410':
          description: endpoint retired under Bundle v2
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - deprecated
                - replacements
                properties:
                  error:
                    type: string
                  deprecated:
                    type: boolean
                  replacements:
                    type: object
                    additionalProperties:
                      type: string
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: unknown app, or an app of a team the caller does not belong
            to
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/apps/{app_id}/addons/{id}":
    parameters:
    - name: app_id
      in: path
      schema:
        type: string
      description: App UUID or name
      required: true
    - name: id
      in: path
      schema:
        type: string
      description: Add-on (database) UUID or name; must be linked to this app
      required: true
    delete:
      summary: Destroy an add-on (farewell snapshot + teardown)
      operationId: addons.destroy
      tags:
      - addons
      security:
      - bearer: []
      responses:
        '200':
          description: add-on removed
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  message:
                    type: string
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: caller is a viewer on the app's team
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: unknown add-on, an add-on not linked to this app, or an app
            of another team
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/apps/{app_id}/addons/shared":
    parameters:
    - name: app_id
      in: path
      schema:
        type: string
      description: App UUID or name
      required: true
    post:
      summary: Enable a shared engine on the app (provisioning queued)
      operationId: addons.enable_shared
      tags:
      - addons
      security:
      - bearer: []
      parameters: []
      responses:
        '202':
          description: engine enabled, provisioning queued
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - app_id
                - engine
                properties:
                  message:
                    type: string
                  app_id:
                    type: string
                    format: uuid
                  engine:
                    type: string
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: caller is a viewer on the app's team
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: unknown app, or an app of a team the caller does not belong
            to
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: unsupported engine, or the plan does not include it ({error})
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - engine
              properties:
                engine:
                  type: string
                  example: redis
  "/api/v1/apps/{app_id}/addons/shared/{engine}":
    parameters:
    - name: app_id
      in: path
      schema:
        type: string
      description: App UUID or name
      required: true
    - name: engine
      in: path
      schema:
        type: string
      description: Engine to remove (e.g. redis)
      required: true
    delete:
      summary: Disable a shared engine and destroy its tenant databases
      operationId: addons.disable_shared
      tags:
      - addons
      security:
      - bearer: []
      responses:
        '200':
          description: engine removed
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  message:
                    type: string
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: caller is a viewer on the app's team
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: unknown app, or an app of a team the caller does not belong
            to
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/apps/{app_id}/addons/dedicated":
    parameters:
    - name: app_id
      in: path
      schema:
        type: string
      description: App UUID or name
      required: true
    post:
      summary: Upgrade a shared tenant to a dedicated container
      operationId: addons.upgrade_dedicated
      tags:
      - addons
      security:
      - bearer: []
      parameters: []
      responses:
        '202':
          description: upgrade queued
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - dedicated_id
                properties:
                  message:
                    type: string
                  dedicated_id:
                    type: string
                    format: uuid
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: viewer on the team, or the plan has no dedicated slots ({error})
          content:
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/Error"
                - type: object
                  required:
                  - error
                  properties:
                    error:
                      type: string
        '404':
          description: unknown app / another team's app, or no shared tenant of that
            engine to upgrade ({error})
          content:
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/Error"
                - type: object
                  required:
                  - error
                  properties:
                    error:
                      type: string
        '422':
          description: unsupported engine, no free slots, size cap exceeded or over
            account limit ({error})
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - engine
              properties:
                engine:
                  type: string
                  example: postgres
  "/api/v1/ai/diagnose":
    post:
      summary: Diagnose a failed deploy
      operationId: ai.diagnose
      tags:
      - ai
      security:
      - bearer: []
      parameters: []
      responses:
        '200':
          description: diagnosis (Markdown)
          content:
            application/json:
              schema:
                type: object
                required:
                - diagnosis
                properties:
                  diagnosis:
                    type: string
        '422':
          description: deploy has no log (no_deploy_log)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '502':
          description: AI provider failed (ai_provider_failed)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '503':
          description: AI not configured on this server (ai_unavailable)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: deploy not found or belongs to another team
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - deploy_id
              properties:
                deploy_id:
                  type: string
                  format: uuid
  "/api/v1/apps/{id}/restart":
    parameters:
    - name: id
      in: path
      schema:
        type: string
      description: App UUID or name
      required: true
    post:
      summary: Restart the app's processes (queued)
      operationId: apps.restart
      tags:
      - apps
      security:
      - bearer: []
      responses:
        '202':
          description: restart queued
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - app_id
                - action
                properties:
                  message:
                    type: string
                  app_id:
                    type: string
                    format: uuid
                  action:
                    type: string
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '402':
          description: account suspended for an unpaid invoice
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: unknown app, or an app of a team the caller does not belong
            to
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/apps/{id}/stop":
    parameters:
    - name: id
      in: path
      schema:
        type: string
      description: App UUID or name
      required: true
    post:
      summary: Stop the app's processes (queued)
      operationId: apps.stop
      tags:
      - apps
      security:
      - bearer: []
