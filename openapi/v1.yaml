          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    post:
      summary: Create a scheduled task (Pro plan feature)
      operationId: scheduled_tasks.create
      tags:
      - scheduled_tasks
      security:
      - bearer: []
      parameters: []
      responses:
        '201':
          description: task created
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - command
                - schedule
                - enabled
                - created_at
                properties:
                  id:
                    type: string
                    format: uuid
                  command:
                    type: string
                    example: bin/rails cleanup
                  schedule:
                    type: string
                    description: cron expression
                    example: "*/5 * * * *"
                  description:
                    type: string
                    nullable: true
                  enabled:
                    type: boolean
                  created_at:
                    type: string
                    format: date-time
        '400':
          description: invalid schedule or command (invalid_params)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: plan lacks scheduled tasks ({error, upgrade_url}); a viewer
            on the team gets the standard Error body
          content:
            application/json:
              schema:
