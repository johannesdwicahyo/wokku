            application/json:
              schema:
                type: object
                required:
                - templates
                - categories
                properties:
                  templates:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Template"
                  categories:
                    type: array
                    items:
                      type: object
                      required:
                      - name
                      - slug
                      properties:
                        name:
                          type: string
                        slug:
                          type: string
