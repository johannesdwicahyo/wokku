---
openapi: 3.0.3
info:
  title: Wokku API (engine)
  version: v1
servers:
- url: https://wokku.cloud
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      required:
      - error
      - error_code
      - retryable
      properties:
        error:
          type: string
        error_code:
          type: string
        hint:
          type: string
          nullable: true
        retryable:
          type: boolean
        details:
          nullable: true
        errors:
          nullable: true
    Team:
      type: object
      required:
      - id
      - name
      - owner_id
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        owner_id:
          type: string
          format: uuid
        plan_id:
          type: string
          format: uuid
          nullable: true
        kind:
          type: string
          enum:
          - personal
          - org
          nullable: true
        slug:
          type: string
          nullable: true
        trial_ends_at:
          type: string
          format: date-time
          nullable: true
        billing_anchor_date:
          type: string
          format: date
          nullable: true
        payment_method_type:
          type: string
        billing_model:
          type: string
        billing_credit_idr:
          type: integer
        billing_switched_on:
          type: string
          format: date
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TeamMember:
      type: object
      required:
      - id
      - user_id
      - email
      - role
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum:
          - viewer
          - member
          - admin
    App:
      type: object
      required:
      - id
      - name
      - server_id
      - team_id
      - status
      - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        server_id:
          type: string
          format: uuid
        team_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - running
          - stopped
          - crashed
          - deploying
          - sleeping
          - created
        is_preview:
          type: boolean
        pr_number:
          type: integer
          nullable: true
        parent_app_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by_id:
          type: string
          format: uuid
        deploy_branch:
          type: string
          nullable: true
        box_size:
          type: string
          nullable: true
        git_repository_url:
          type: string
          nullable: true
        github_repo_full_name:
          type: string
          nullable: true
        pending_action:
          type: string
          nullable: true
        container_port:
          type: integer
        cloudflare_proxied:
          type: boolean
        https_redirect:
          type: boolean
        maintenance_mode:
          type: boolean
        enabled_shared_engines:
          type: array
          items:
            type: string
        uptime_status:
          type: string
        deploy_locked_at:
          type: string
          format: date-time
          nullable: true
        last_commit_sha:
          type: string
          nullable: true
        git_remote:
          type: string
        push_instructions:
          type: string
        host_status:
          type: string
          nullable: true
        host_heartbeat_at:
          type: string
          format: date-time
          nullable: true
        warnings:
          type: array
          items:
            type: string
    Deploy:
      type: object
      required:
      - id
      - status
      - created_at
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - pending
          - building
          - succeeded
          - failed
          - timed_out
        commit_sha:
          type: string
          nullable: true
        log:
          type: string
          nullable: true
          description: Only on deploys.show
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    Release:
      type: object
      required:
      - id
      - version
      - app_record_id
      - created_at
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
        description:
          type: string
          nullable: true
        app_record_id:
          type: string
          format: uuid
        deploy_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Process:
      type: object
      required:
      - processes
      properties:
        processes:
          type: object
          additionalProperties:
            type: string
    Device:
      type: object
      required:
      - token
      - platform
      properties:
        token:
          type: string
        platform:
          type: string
          enum:
          - ios
          - android
    Activity:
      type: object
      required:
      - id
      - action
      - description
      - created_at
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
        description:
          type: string
        target_name:
          type: string
          nullable: true
        target_type:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
security:
- bearer: []
paths:
  "/api/v1/activities":
    get:
      summary: Recent activity for the caller's first team
      operationId: activities.list
      tags:
      - activities
      security:
      - bearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      responses:
        '200':
          description: activities, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Activity"
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/ai/diagnose":
    post:
      summary: Diagnose a failed deploy
      operationId: ai.diagnose
      tags:
      - ai
      security:
      - bearer: []
      parameters: []
      responses:
        '200':
          description: diagnosis (Markdown)
          content:
            application/json:
              schema:
                type: object
                required:
                - diagnosis
                properties:
                  diagnosis:
                    type: string
        '422':
          description: deploy has no log (no_deploy_log)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '502':
          description: AI provider failed (ai_provider_failed)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '503':
          description: AI not configured on this server (ai_unavailable)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: deploy not found or belongs to another team
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - deploy_id
              properties:
                deploy_id:
                  type: string
                  format: uuid
  "/api/v1/apps/{id}/restart":
    parameters:
    - name: id
      in: path
      schema:
        type: string
      description: App UUID or name
      required: true
    post:
      summary: Restart the app's processes (queued)
      operationId: apps.restart
      tags:
      - apps
      security:
      - bearer: []
      responses:
        '202':
          description: restart queued
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - app_id
                - action
                properties:
                  message:
                    type: string
                  app_id:
                    type: string
                    format: uuid
                  action:
                    type: string
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '402':
          description: account suspended for an unpaid invoice
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: unknown app, or an app of a team the caller does not belong
            to
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/apps/{id}/stop":
    parameters:
    - name: id
      in: path
      schema:
        type: string
      description: App UUID or name
      required: true
    post:
      summary: Stop the app's processes (queued)
      operationId: apps.stop
      tags:
      - apps
      security:
      - bearer: []
      responses:
        '202':
          description: stop queued
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - app_id
                - action
                properties:
                  message:
                    type: string
                  app_id:
                    type: string
                    format: uuid
                  action:
                    type: string
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: unknown app, or an app of a team the caller does not belong
            to
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/apps/{id}/start":
    parameters:
    - name: id
      in: path
      schema:
        type: string
      description: App UUID or name
      required: true
    post:
      summary: Start the app's processes (queued)
      operationId: apps.start
      tags:
      - apps
      security:
      - bearer: []
      responses:
        '202':
          description: start queued
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - app_id
                - action
                properties:
                  message:
                    type: string
                  app_id:
                    type: string
                    format: uuid
                  action:
                    type: string
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '402':
          description: account suspended for an unpaid invoice
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: unknown app, or an app of a team the caller does not belong
            to
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/apps/{id}/deploy":
    parameters:
    - name: id
      in: path
      schema:
        type: string
      description: App UUID or name
      required: true
    post:
      summary: Trigger a deploy
      operationId: apps.deploy
      tags:
      - apps
      security:
      - bearer: []
      responses:
        '202':
          description: deploy queued
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - deploy_id
                - release_id
                properties:
                  message:
                    type: string
                  deploy_id:
                    type: string
                    format: uuid
                  release_id:
                    type: string
                    format: uuid
        '409':
          description: app is locked
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: unknown app, or an app of a team the caller does not belong
            to
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/apps/{id}/run":
    parameters:
    - name: id
      in: path
      schema:
        type: string
      description: App UUID or name
      required: true
    post:
      summary: Run a one-off command (async; poll GET /apps/{app_id}/runs/{id})
      operationId: apps.run
      tags:
      - apps
      security:
      - bearer: []
      parameters: []
      responses:
        '202':
          description: run queued
          content:
            application/json:
              schema:
                type: object
                required:
                - run_id
                properties:
                  run_id:
                    type: string
                    format: uuid
        '400':
          description: command missing
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: the app has no deployable image yet (deploy first)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '409':
          description: another operation already holds the app's lane
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: unknown app, or an app of a team the caller does not belong
            to
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - command
              properties:
                command:
                  type: string
  "/api/v1/apps/{id}/dokku":
    parameters:
    - name: id
      in: path
      schema:
        type: string
      description: App UUID or name
      required: true
    post:
      summary: Retired raw passthrough (always 410)
      operationId: apps.dokku
      tags:
      - apps
      deprecated: true
      security:
      - bearer: []
      responses:
        '410':
          description: passthrough retired; use the typed commands
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: unknown app, or an app of a team the caller does not belong
            to
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/apps/{id}/github_connect":
    parameters:
    - name: id
      in: path
      schema:
        type: string
      description: App UUID or name
      required: true
    post:
      summary: Connect a GitHub repo for deploy-on-push
      operationId: apps.github_connect
      tags:
      - apps
      security:
      - bearer: []
      parameters: []
      responses:
        '200':
          description: connected
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - app_id
                - github_repo
                - deploy_branch
                properties:
                  message:
                    type: string
                  app_id:
                    type: string
                    format: uuid
                  github_repo:
                    type: string
                  deploy_branch:
                    type: string
        '422':
          description: repo missing
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: unknown app, or an app of a team the caller does not belong
            to
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - repo
              properties:
                repo:
                  type: string
                  description: owner/name
                branch:
                  type: string
                  default: main
  "/api/v1/apps/{id}/github_disconnect":
    parameters:
    - name: id
      in: path
      schema:
        type: string
      description: App UUID or name
      required: true
    delete:
      summary: Disconnect the GitHub repo
      operationId: apps.github_disconnect
      tags:
      - apps
      security:
      - bearer: []
      responses:
        '200':
          description: disconnected
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  message:
                    type: string
        '404':
          description: unknown app, or an app of a team the caller does not belong
            to
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/apps/{id}/https":
    parameters:
    - name: id
      in: path
      schema:
        type: string
      description: App UUID or name
      required: true
    patch:
      summary: Enable or disable HTTPS redirect
      operationId: apps.https
      tags:
      - apps
      security:
      - bearer: []
      parameters: []
      responses:
        '200':
          description: new state
          content:
            application/json:
              schema:
                type: object
                required:
                - enabled
                properties:
                  enabled:
                    type: boolean
        '422':
          description: enabled missing
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '502':
          description: the host refused the change
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: unknown app, or an app of a team the caller does not belong
            to
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - enabled
              properties:
                enabled:
                  type: boolean
  "/api/v1/apps/{id}/cdn":
    parameters:
    - name: id
      in: path
      schema:
        type: string
      description: App UUID or name
      required: true
    patch:
      summary: Enable or disable the Cloudflare CDN proxy
      operationId: apps.cdn
      tags:
      - apps
      security:
      - bearer: []
      parameters: []
      responses:
        '200':
          description: new state
          content:
            application/json:
              schema:
                type: object
                required:
                - enabled
                properties:
                  enabled:
                    type: boolean
        '422':
          description: enabled missing
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '502':
          description: the host refused the change
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: unknown app, or an app of a team the caller does not belong
            to
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - enabled
              properties:
                enabled:
                  type: boolean
  "/api/v1/apps/{id}/maintenance":
    parameters:
    - name: id
      in: path
      schema:
        type: string
      description: App UUID or name
      required: true
    patch:
      summary: Enable or disable maintenance mode
      operationId: apps.maintenance
      tags:
      - apps
      security:
      - bearer: []
      parameters: []
      responses:
        '200':
          description: new state
          content:
            application/json:
              schema:
                type: object
                required:
                - enabled
                properties:
                  enabled:
                    type: boolean
        '422':
          description: enabled missing
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '502':
          description: the host refused the change
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: unknown app, or an app of a team the caller does not belong
            to
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - enabled
              properties:
                enabled:
                  type: boolean
  "/api/v1/apps/{id}/rename":
    parameters:
    - name: id
      in: path
      schema:
        type: string
      description: App UUID or name
      required: true
    patch:
      summary: Rename the app
      operationId: apps.rename
      tags:
      - apps
      security:
      - bearer: []
      parameters: []
      responses:
        '200':
          description: renamed
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - name
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
        '400':
          description: invalid name
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '409':
          description: name taken
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: unknown app, or an app of a team the caller does not belong
            to
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
  "/api/v1/apps/{id}/clone":
    parameters:
    - name: id
      in: path
      schema:
        type: string
      description: App UUID or name
      required: true
    post:
      summary: Clone the app (config; deploy skipped by default)
      operationId: apps.clone
      tags:
      - apps
      security:
      - bearer: []
      parameters: []
      responses:
        '200':
          description: cloned
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - name
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
        '409':
          description: name taken
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: unknown app, or an app of a team the caller does not belong
            to
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                skip_deploy:
                  type: boolean
                  default: true
  "/api/v1/apps/{id}/transfer":
    parameters:
    - name: id
      in: path
      schema:
        type: string
      description: App UUID or name
      required: true
    post:
      summary: Start an ownership transfer (team admin only)
      operationId: apps.transfer
      tags:
      - apps
      security:
      - bearer: []
      parameters: []
      responses:
        '200':
          description: transfer requested
          content:
            application/json:
              schema:
                type: object
                required:
                - transfer_id
                - recipient_email
                - expires_at
                properties:
                  transfer_id:
                    type: string
                    format: uuid
                  recipient_email:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
        '400':
          description: invalid recipient
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '409':
          description: a transfer is already pending
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: unknown app, or an app of a team the caller does not belong
            to
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - recipient_email
              properties:
                recipient_email:
                  type: string
  "/api/v1/apps/{id}/lock":
    parameters:
    - name: id
      in: path
      schema:
        type: string
      description: App UUID or name
      required: true
    post:
      summary: Lock deploys
      operationId: apps.lock
      tags:
      - apps
      security:
      - bearer: []
      responses:
        '200':
          description: locked
          content:
            application/json:
              schema:
                type: object
                required:
                - locked
                properties:
                  locked:
                    type: boolean
        '404':
          description: unknown app, or an app of a team the caller does not belong
            to
          content:
