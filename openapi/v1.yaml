                  - enabled
                  - created_at
                  properties:
                    id:
                      type: string
                      format: uuid
                    command:
                      type: string
                      example: bin/rails cleanup
                    schedule:
                      type: string
                      description: cron expression
                      example: "*/5 * * * *"
                    description:
                      type: string
                      nullable: true
                    enabled:
                      type: boolean
                    created_at:
                      type: string
                      format: date-time
