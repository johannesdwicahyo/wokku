          description: server created (ssh_private_key and ingest_token are never
            returned)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Server"
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: caller is not a system admin
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: missing or duplicate name/host (validation_failed)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - host
              properties:
                name:
                  type: string
                  example: edge-01
                host:
                  type: string
                  example: 203.0.113.10
                port:
                  type: integer
                  example: 22
                ssh_user:
                  type: string
                ssh_private_key:
                  type: string
                  description: Write-only; never returned
