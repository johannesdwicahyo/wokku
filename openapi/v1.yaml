  "/api/v1/apps/{app_id}/logs":
    parameters:
    - name: app_id
      in: path
      schema:
        type: string
      description: App UUID or name
      required: true
    get:
      summary: Recent logs (JSON); with follow=1 a live text/plain stream
      operationId: logs.list
      tags:
      - logs
      security:
      - bearer: []
      parameters:
      - name: follow
        in: query
        required: false
        schema:
          type: string
          enum:
          - '1'
          - 'true'
        description: 1/true switches to a chunked text/plain stream of live log output
      - name: since
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: until
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: lines
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
      - name: level
        in: query
        required: false
        schema:
          type: string
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: Substring filter
      responses:
        '200':
          description: log lines (JSON), or a text/plain stream when follow=1
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                type: object
                required:
                - logs
                - source
                properties:
                  logs:
                    oneOf:
                    - type: array
                      items:
                        type: object
                        required:
                        - ts
                        - container
                        - level
                        - line
                        properties:
                          ts:
                            type: string
                            format: date-time
                          container:
                            type: string
                          level:
                            type: string
                          line:
                            type: string
                    - type: string
                      description: Raw tail output when source is live
                  source:
                    type: string
                    enum:
                    - durable
                    - live
        '502':
          description: durable store empty and the live SSH tail failed (dokku_command_failed)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '503':
          description: durable store empty and the host is unreachable (host_unreachable,
            retryable)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '400':
          description: since/until not parseable (invalid_time)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: unknown app, or an app of a team the caller does not belong
            to
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
