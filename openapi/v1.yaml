  "/api/v1/templates/deploy":
    post:
      summary: Deploy a template as a new app
      operationId: templates.deploy
      tags:
      - templates
      security:
      - bearer: []
      parameters: []
      responses:
        '201':
          description: app created; the deploy runs in the background
          content:
            application/json:
              schema:
                type: object
                required:
                - app
                - deploy
                properties:
                  app:
                    type: object
                    required:
                    - id
                    - name
                    - status
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      status:
                        type: string
                      box_size:
                        type: string
                        nullable: true
                  deploy:
                    type: object
                    required:
                    - id
                    - status
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        type: string
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: plan box quota reached (ad-hoc body)
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '404':
          description: unknown template or server
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '409':
          description: app name already taken on that server (already_exists)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: blank app_name (ad-hoc body) or builder preflight refusal (typed
            Error)
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - slug
              - server_id
              - app_name
              properties:
                slug:
                  type: string
                  example: n8n
                server_id:
                  type: string
                  description: Server UUID or name
                app_name:
                  type: string
                  example: my-n8n
                  description: Parameterized to a DNS-safe name
