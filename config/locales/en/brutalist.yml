  hero:
    eyebrow: "// the VPS that doesn't bite back"
    body: "Managed app hosting for vibecoders, freelancers, and agencies. Pay for the CPU & RAM you use, from Rp15K/month — clear prices in Rupiah. Patching, SSL, backups, uptime: handled. Install Ghost, WordPress, n8n in one click. Pay with QRIS."
    pill_qris: "QRIS · GoPay · OVO · DANA"
    pill_price: "From Rp15K / mo"
    pill_region: "Jakarta region · <20ms"
    pill_support: "WhatsApp support"
    pill_ai_native: "AI-native"
    cta_primary: "> start_free()"
    cta_secondary: "> see_pricing()"
    cta_note: "// free tier · no card · live in ~60s"
  compare:
    eyebrow: "// what the rest cost"
    headline: "Same stack. From Rp15K."
    body: "Pay per CPU & RAM, in Rupiah. Pay with QRIS."
    you: "← that's you"
    pays_usd: "USD card only"
    pays_idr: "QRIS · IDR"
    note: "// public list prices, comparable basic plan + managed postgres, may 2026"
    suffix_month: "mo"
    rows:
      heroku:  { name: "Heroku Eco + addons", price: "~$15",     desc: "Eco dyno + Essential-1 Postgres" }
      vercel:  { name: "Vercel Pro",           price: "$20/user", desc: "Per-seat + metered overage" }
      railway: { name: "Railway Hobby",        price: "$5+",      desc: "$5 base + per-second metering" }
      wokku:   { name: "Wokku Nano",           price: "Rp15K",   desc: "0.25 vCPU · 256 MB · free Postgres + Redis · QRIS" }
  features:
    eyebrow: "// the boring stuff, done right"
    headline: "Production-grade, built in."
    items:
      - { title: "Push to deploy",     body: "git push wokku main — your app builds, deploys, and goes live with SSL." }
      - { title: "1-click templates",  body: "60+ open-source apps, pre-configured: WordPress, Ghost, n8n, NocoDB." }
      - { title: "PR Previews",        body: "Every pull request gets its own live URL. Auto-cleaned on merge." }
      - { title: "Scheduled tasks",    body: "Cron jobs as first-class citizens. Define in app.json, edit in the dashboard." }
      - { title: "Transfer app",       body: "Move app ownership to a client account. Bill them directly. Agency-ready." }
      - { title: "AI-native",          body: "Claude / Codex / Cursor can deploy, scale, and debug via MCP + CLI. You stay in the editor." }
  templates:
    headline: "The apps you'd install on cPanel — deployed in 60 seconds."
    count: "%{n}+ templates"
  why:
    eyebrow: "// what wokku kills"
    headline_a: "The chores your VPS"
    headline_b: "makes you do — gone."
    items:
      - { tag: "no more 3am ssh sessions",          title: "Server patching.",     body: "We patch the host. You sleep on Saturday." }
      - { tag: "git push · zero downtime",          title: "Manual deploys.",      body: "git push. Done. No scp, no pm2 restart cycles." }
      - { tag: "let's encrypt · auto-renewed",      title: "SSL renewals.",        body: "Let's Encrypt, auto-renewed forever. Stop forgetting." }
      - { tag: "health checks · auto-restart",      title: "Downtime calls.",      body: "Health checks + auto-restart. Your client stops pinging you at 11pm." }
    flag_caption: "// made in Bali · PT Wokku Teknologi Nusantara"
  cta:
    eyebrow: "// ready when you are"
    headline_a: "Your weekend back. Your bill predictable."
    headline_b: "Your AI in the driver's seat."
    body: "3 free apps forever — they sleep when idle and wake on the next visit. From Rp15K/month when you're ready. Pay with QRIS, GoPay, or card."
    deploy: "> start_free()"
    docs: "> read_docs()"
    chat: "> chat_wa()"
  freelance_vps_pain:
    intent_capture:
      kicker: "not ready yet?"
      title: "Tell us what's eating your VPS time."
      body: "One sentence. We read every one. (We use it to make Wokku less annoying for people exactly like you.)"
      email_placeholder: "your@email.dev (optional)"
      pain_placeholder: "e.g. SSL keeps expiring on 3 client servers and I'm the one who gets the call"
