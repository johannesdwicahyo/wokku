      wa_cta: "or chat on WhatsApp"
      wa_prefilled: "Hi — saw the Wokku landing. The thing eating my VPS time is:"
      thanks_kicker: "thanks"
      thanks_title: "Got it. We'll be in touch."
      thanks_body: "If you left an email, we'll reply within 48 hours. If not — well, we still read it. Now go deploy a test app: wokku.cloud/dashboard."
