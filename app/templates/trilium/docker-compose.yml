# name: Trilium Notes
# documentation: https://github.com/zadam/trilium
# slogan: Hierarchical note-taking application with scripting and graph visualization
# category: productivity
# tags: notes, wiki, knowledge-base, hierarchical
# icon: productivity
# port: 8080
# storage_mounts: /home/node/trilium-data

services:
  trilium:
    image: zadam/trilium:0.63.7@sha256:a0b5a6a5fd7a64391ae6039bbcd5493151a77a1d5470ef5911923c64d0c232c0
    environment:
      - TRILIUM_DATA_DIR=/home/node/trilium-data
    ports:
      - "8080:8080"
    volumes:
      - trilium-data:/home/node/trilium-data

volumes:
  trilium-data:
