# name: Maybe
# documentation: https://github.com/maybe-finance/maybe
# slogan: Self-hosted personal finance and wealth management application
# category: finance
# tags: finance, budgeting, investments, wealth
# icon: finance
# deploy_method: docker_image
# port: 3000

services:
  maybe:
    image: ghcr.io/maybe-finance/maybe:0.6.0@sha256:1e791e88ecc4d124d05142d943bcec5b5a172e889f648c97d334363133384f01
    environment:
      - RAILS_ENV=production
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
