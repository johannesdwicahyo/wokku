# name: Saleor
# documentation: https://github.com/saleor/saleor
# slogan: GraphQL-first e-commerce platform
# category: ecommerce
# hidden: true
# tags: ecommerce, graphql, python
# icon: ecommerce
# port: 8000

services:
  saleor:
    image: ghcr.io/saleor/saleor:3.23.45@sha256:e2fa142c005ca8a859e0ed716229beb594f19a51712713df4e259afe15893f57
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7

volumes:
  postgres-data:
