# name: Wallabag
# documentation: https://github.com/wallabag/wallabag
# slogan: Read-it-later and bookmark manager
# category: rss
# tags: read-later, bookmarks, php
# icon: rss
# port: 80

services:
  wallabag:
    image: wallabag/wallabag:2.6.15.1@sha256:2e9d9fbbba6feee060109351d1235386fa4ac495f98c82d94a250d56feaeaeeb
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
