# name: Jellyfin
# documentation: https://github.com/jellyfin/jellyfin
# slogan: Free software media system for managing and streaming personal media
# category: media
# tags: media, streaming, video, music, photos
# icon: media
# icon_slug: jellyfin
# icon_color: 00A4DC
# port: 8096

services:
  jellyfin:
    image: jellyfin/jellyfin:12.4@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
    environment:
      - JELLYFIN_PublishedServerUrl=http://localhost:8096
    ports:
      - "8096:8096"
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache

volumes:
  jellyfin-config:
  jellyfin-cache:
