# name: Matomo
# documentation: https://github.com/matomo-org/matomo
# slogan: Open-source web analytics platform that respects user privacy
# category: analytics
# tags: analytics, privacy, tracking, gdpr
# icon: analytics
# icon_slug: matomo
# icon_color: FFFFFF
# port: 80
# dedicated_db_engine: mariadb
# mysql_components: MATOMO_DATABASE_

services:
  matomo:
    image: matomo:5.14.2@sha256:db40a508196ba5327a53dcae07d12835e50c7764bdaae3ea7822c35d432e64dc
    environment:
      - MATOMO_DATABASE_HOST=mysql
      - MATOMO_DATABASE_DBNAME=matomo
      - MATOMO_DATABASE_USERNAME=matomo
      - MATOMO_DATABASE_PASSWORD=matomo
    ports:
      - "80:80"
    depends_on:
      - mysql
    volumes:
      - matomo-data:/var/www/html

  mysql:
    image: mariadb:11
    environment:
      - MYSQL_DATABASE=matomo
      - MYSQL_USER=matomo
      - MYSQL_PASSWORD=matomo
      - MYSQL_ROOT_PASSWORD=rootpassword
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  matomo-data:
  mysql-data:
