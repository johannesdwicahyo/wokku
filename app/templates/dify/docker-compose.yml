# name: Dify
# documentation: https://github.com/langgenius/dify
# slogan: Open-source AI workflow and LLM application development platform
# category: ai
# tags: ai, llm, workflow, chatbot, rag
# icon: ai
# icon_slug: dify
# icon_color: FFFFFF
# deploy_method: docker_image
# port: 3000

services:
  dify:
    image: langgenius/dify-web:1.18.0@sha256:e55a6bf1addf109c3655567663f906624f0980061efed864e0f07d23c71fa385
    environment:
      - EDITION=SELF_HOSTED
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
