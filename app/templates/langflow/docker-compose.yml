# name: Langflow
# documentation: https://github.com/langflow-ai/langflow
# slogan: Visual framework for building LLM applications
# category: ai
# tags: ai, llm, python, workflow
# icon: ai
# port: 7860

services:
  langflow:
    image: langflowai/langflow:1.13.0@sha256:ff2716e017f4a4bbb9e83556bf66c3d5d70a1d3eb7cffd893312600ba84e303f
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
