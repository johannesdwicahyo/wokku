# name: Cal.com
# documentation: https://github.com/calcom/cal.com
# slogan: Scheduling platform like Calendly
# category: productivity
# tags: scheduling, calendar, node
# icon: calendar
# port: 3000
# shared_engines: postgres

services:
  calcom:
    image: calcom/cal.com:v6.2.0@sha256:ace3bb1219fb7306585ab9f4d94d41af7ee064c343db0498173436bbe857bd49
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
