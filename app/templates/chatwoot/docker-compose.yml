# name: Chatwoot
# documentation: https://www.chatwoot.com/docs/self-hosted
# slogan: Open-source customer support platform
# category: communication
# tags: chat, support, customer-service, ruby
# icon: chat
# icon_slug: chatwoot
# icon_color: 1F93FF
# port: 3000
# min_tier: standard
# post_deploy: bundle exec rails db:chatwoot_prepare
# generate_secrets: SECRET_KEY_BASE
# set_url: FRONTEND_URL
# postgres_components: POSTGRES_
# alias_env: POSTGRES_USERNAME=POSTGRES_USER
# storage_mounts: /app/storage

services:
  chatwoot:
    image: chatwoot/chatwoot:latest
    command: bundle exec rails s -p 3000 -b 0.0.0.0
    environment:
      - RAILS_ENV=production
      - RAILS_LOG_TO_STDOUT=true
      - INSTALLATION_ENV=docker
      - ENABLE_ACCOUNT_SIGNUP=true
      - ACTIVE_STORAGE_SERVICE=local
    depends_on:
      - postgres
      - redis
    volumes:
      - chatwoot-storage:/app/storage

  postgres:
    image: pgvector/pgvector:pg16

  redis:
    image: redis:7

volumes:
  chatwoot-storage:
