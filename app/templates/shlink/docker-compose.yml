# name: Shlink
# documentation: https://github.com/shlinkio/shlink
# slogan: Self-hosted URL shortener with analytics
# category: links
# tags: url-shortener, links, php
# icon: link
# port: 8080

services:
  shlink:
    image: shlinkio/shlink:5.1.8@sha256:68a722f7677008a50ccf3a9e570966bc37d7627fe6a870b86be28c5dcf9085ee
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
