# name: Documenso
# documentation: https://github.com/documenso/documenso
# slogan: Digital document signing platform
# category: productivity
# hidden: true
# tags: e-signature, documents, node
# icon: form
# port: 3000

services:
  documenso:
    image: documenso/documenso:v2.21.1
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
