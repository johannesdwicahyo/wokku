# name: FreshRSS
# documentation: https://github.com/FreshRSS/FreshRSS
# slogan: Self-hosted RSS feed aggregator and reader
# category: productivity
# tags: rss, feed, reader, aggregator
# icon: productivity
# port: 80

services:
  freshrss:
    image: freshrss/freshrss:1.30.4@sha256:af44385229541bee24aa9148d0ff8f3b40e095373c63a2c0f74e09a27d3c59df
    environment:
      - TZ=UTC
      - CRON_MIN=1,31
    ports:
      - "80:80"
    volumes:
      - freshrss-data:/var/www/FreshRSS/data
      - freshrss-extensions:/var/www/FreshRSS/extensions

volumes:
  freshrss-data:
  freshrss-extensions:
