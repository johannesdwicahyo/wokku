# name: Outline
# documentation: https://github.com/outline/outline
# slogan: Team wiki and knowledge base
# category: databases
# hidden: true
# tags: wiki, knowledge-base, node
# icon: wiki
# port: 3000
# shared_engines: postgres, redis
# set_url: URL
# generate_secrets: SECRET_KEY, UTILS_SECRET

services:
  outline:
    image: outlinewiki/outline:1.12.0@sha256:25d6a2ced2f1f0cf03c09abd776d87ba31941ed96d3a99992aa84b3bd0afc074
    environment:
      # Wokku databases speak plain TCP on the private overlay.
      - PGSSLMODE=disable
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7

volumes:
  postgres-data:
