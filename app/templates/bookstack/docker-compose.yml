# name: Bookstack
# documentation: https://github.com/BookStackApp/BookStack
# slogan: Simple wiki and documentation platform
# category: cms
# tags: wiki, docs, php
# icon: wiki
# port: 80
# dedicated_db_engine: mariadb
# mysql_components: DB_
# alias_env: DB_USERNAME=DB_USER
# set_url: APP_URL
# generate_secrets: APP_KEY
# storage_mounts: /config

services:
  bookstack:
    image: lscr.io/linuxserver/bookstack:26.09.2@sha256:2ece67eeffcc8601f2c3d44c77d787ce49b1e0becfcb2c4bd8ce9b69fa8393ed
    depends_on:
      - mysql

  mysql:
    image: mariadb:11
    volumes:
      - mysql-data:/var/lib/mysql/data

volumes:
  mysql-data:
