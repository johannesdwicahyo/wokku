# name: Traefik
# documentation: https://github.com/traefik/traefik
# slogan: Modern HTTP reverse proxy and load balancer for microservices
# category: developer-tools
# tags: proxy, load-balancer, ingress, networking
# icon: developer-tools
# icon_slug: traefikproxy
# icon_color: 24A1C1
# port: 8080

services:
  traefik:
    image: traefik:v3.7@sha256:a6c0194dda77bcb804824580f36fa7edc56e315b1acfe933366c8b52844a78a4
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
