# name: Miniflux
# documentation: https://github.com/miniflux/v2
# slogan: Minimalist RSS reader
# category: rss
# tags: rss, reader, go
# icon: rss
# port: 8080

services:
  miniflux:
    image: miniflux/miniflux:2.3.5@sha256:8fd6c3c434ecc3d4083306f83e03c0bb74c632e0f8378da5ead7e1773b0b89c9
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
