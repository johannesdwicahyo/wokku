# name: Rallly
# documentation: https://github.com/lukevella/rallly
# slogan: Self-hosted scheduling and poll tool for finding the best meeting time
# category: productivity
# tags: scheduling, polls, meetings, calendar
# icon: productivity
# deploy_method: docker_image
# port: 3000

services:
  rallly:
    image: lukevella/rallly:4.16.4@sha256:1dacb9297f29d89d543f6fe4de2f8703b2c59e854bac1953fc66a6dbc1d1d8b0
    environment:
      - NODE_ENV=production
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
