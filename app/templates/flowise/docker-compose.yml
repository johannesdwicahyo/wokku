# name: Flowise
# documentation: https://github.com/FlowiseAI/Flowise
# slogan: Drag-and-drop LLM chatbot builder
# category: ai
# tags: ai, llm, chatbot, node
# icon: ai
# port: 3000

services:
  flowise:
    image: flowiseai/flowise:3.1.4@sha256:3922767afb52a5777759fd8b28a3c9eee864daea96018a791f2429eae2a76571
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
