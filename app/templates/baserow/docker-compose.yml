# name: Baserow
# documentation: https://github.com/baserow/baserow
# slogan: Open-source no-code database platform
# category: databases
# hidden: true
# tags: no-code, database, python
# icon: db
# port: 80

services:
  baserow:
    image: baserow/baserow:2.4.1
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7

volumes:
  postgres-data:
