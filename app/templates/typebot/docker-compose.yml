# name: Typebot
# documentation: https://github.com/baptisteArno/typebot.io
# slogan: Conversational form and chatbot builder
# category: communication
# hidden: true
# tags: chatbot, forms, node
# icon: chat
# port: 3000

services:
  typebot:
    image: baptistearno/typebot-builder:3.19.1@sha256:9b277e31c84773f49a07ef2d48c90dc83b01cabeaeef6eb1c43005264d194fdd
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
