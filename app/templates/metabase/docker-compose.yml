# name: Metabase
# documentation: https://github.com/metabase/metabase
# slogan: Business intelligence and analytics dashboards
# category: analytics
# tags: bi, dashboards, java
# icon: analytics
# port: 3000
# min_tier: standard

services:
  metabase:
    image: metabase/metabase:v0.65.2.6@sha256:81dc964c9f2cf4ba3a44535bfb6f3a7f243e718e137924ffa294ede68b57b6b3
    environment:
      # JVM defaults to 25% of the box (256 MB) and dies with OutOfMemoryError.
      - JAVA_OPTS=-XX:MaxRAMPercentage=75
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
